name: Refresh popular wallpaper summaries

on:
  schedule:
    # 04:00 Asia/Seoul (UTC+9)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: actorwallpaper-41b69
            secret: FIREBASE_SERVICE_ACCOUNT_ACTORWALLPAPER
          - project: diary-project-55e9a
            secret: FIREBASE_SERVICE_ACCOUNT_DIARY
          - project: gif-collection-db25a
            secret: FIREBASE_SERVICE_ACCOUNT_GIF_COLLECTION
          - project: wallpaper-7ce0c
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER
          - project: wallpaper1-96c5a
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER1
          - project: wallpaper2-986ed
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER2
          - project: wallpaper3-63f64
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER3
          - project: wallpaper4-150d9
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER4
          - project: worldstart2-8c9cc
            secret: FIREBASE_SERVICE_ACCOUNT_WORLDSTART2
    concurrency:
      group: popular-summary-${{ matrix.project }}
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT_ID: ${{ matrix.project }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets[matrix.secret] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project credential
        id: credential
        shell: bash
        run: |
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping $FIREBASE_PROJECT_ID because its repository secret is not configured."
          fi

      - name: Set up Node.js
        if: steps.credential.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        if: steps.credential.outputs.configured == 'true'
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Refresh summaries
        if: steps.credential.outputs.configured == 'true'
        env:
          POPULAR_JSON_OUTPUT_DIR: ${{ runner.temp }}/popular_json
        run: node functions/index.js

      - name: Publish static JSON to offsong.github.io
        if: steps.credential.outputs.configured == 'true'
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ runner.temp }}/popular_json"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A "$OUTPUT_DIR" 2>/dev/null)" ]; then
            echo "No popular JSON files generated for $FIREBASE_PROJECT_ID, skipping publish."
            exit 0
          fi
          if [ -z "${PAGES_DEPLOY_TOKEN:-}" ]; then
            echo "::warning::PAGES_DEPLOY_TOKEN secret is not configured; skipping static JSON publish."
            exit 0
          fi

          PAGES_DIR="${{ runner.temp }}/offsong-popular-pages"
          git clone --depth 1 "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/offsong/popular.git" "$PAGES_DIR"

          cp "$OUTPUT_DIR"/*.json "$PAGES_DIR/"

          cd "$PAGES_DIR"
          git config user.name "popular-summary-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ./*.json
          if git diff --cached --quiet; then
            echo "No changes to publish for $FIREBASE_PROJECT_ID."
            exit 0
          fi
          git commit -m "Update popular wallpaper summaries (${{ matrix.project }})"

          # Other matrix jobs may push to the same pages repo concurrently; retry on conflict.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "Push rejected, retrying ($attempt)..."
            sleep $((attempt * 3))
            git pull --rebase origin HEAD
          done
          echo "::error::Failed to push popular JSON for $FIREBASE_PROJECT_ID after multiple retries."
          exit 1
