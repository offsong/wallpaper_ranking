name: Refresh popular wallpaper summaries

on:
  schedule:
    # 04:00 Asia/Seoul (UTC+9)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: actorwallpaper-41b69
            secret: FIREBASE_SERVICE_ACCOUNT_ACTORWALLPAPER
          - project: diary-project-55e9a
            secret: FIREBASE_SERVICE_ACCOUNT_DIARY
          - project: gif-collection-db25a
            secret: FIREBASE_SERVICE_ACCOUNT_GIF_COLLECTION
          - project: wallpaper-7ce0c
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER
          - project: wallpaper1-96c5a
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER1
          - project: wallpaper2-986ed
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER2
          - project: wallpaper3-63f64
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER3
          - project: wallpaper4-150d9
            secret: FIREBASE_SERVICE_ACCOUNT_WALLPAPER4
          - project: worldstart2-8c9cc
            secret: FIREBASE_SERVICE_ACCOUNT_WORLDSTART2
    concurrency:
      group: popular-summary-${{ matrix.project }}
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT_ID: ${{ matrix.project }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets[matrix.secret] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project credential
        id: credential
        shell: bash
        run: |
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping $FIREBASE_PROJECT_ID because its repository secret is not configured."
          fi

      - name: Set up Node.js
        if: steps.credential.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        if: steps.credential.outputs.configured == 'true'
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Refresh summaries
        if: steps.credential.outputs.configured == 'true'
        run: node functions/index.js
